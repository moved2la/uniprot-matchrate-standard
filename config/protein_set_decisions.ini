# ============================================================
#  protein_set_decisions.ini — HAND-WRITTEN. The only human input to Layer A.
#
#  One section per entry in the standard. Keys:
#    gene          UniProt primary gene symbol (resolved to an accession by
#                  verify_accessions.py — never type an accession here)
#    isoform       canonical | <UniProt isoform id, e.g. Q8WZ42-4>
#    tier          1 | 2 | 3 | excluded
#    compartment   thick_filament | thin_filament | z_disc | m_band | scaffold |
#                  sarcoplasm | cytoskeleton
#    fiber_type    I | IIa | IIx | all   (comma list = subset)
#    role          short protein description
#    justification why this entry, this isoform, this tier (cite where needed)
#    processing    (optional, isoform entries only) none | master:<start>-<end>
#                  Default: inherit canonical N-terminal processing iff the
#                  isoform is sequence-identical over the removed span.
#
#  Lengths, versions, checksums and segment coordinates are NOT here.
#  build_protein_set.py derives them from data/ and writes config/accessions.ini
#  and config/segments.ini. Decision numbers: docs/decisions.md D24-D36.
# ============================================================

# ---------------- Tier 1: myofibrillar ----------------

[MYH7]
gene          = MYH7
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = I
role          = Myosin heavy chain 7 (slow / type I; MYH7)
justification = Defining MYH of type I fibers. No splice isoforms in UniProt. Met1 not annotated as removed.

[MYH2]
gene          = MYH2
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = IIa
role          = Myosin heavy chain 2 (fast IIa)
justification = Defining MYH of type IIa fibers. Isoform 2 (708 aa) is a fragment; canonical used.

[MYH1]
gene          = MYH1
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = IIx
role          = Myosin heavy chain 1 (fast IIx)
justification = Defining MYH of type IIx fibers. Own accession per D6; no IIa proxy.

[MYL1_MLC1f]
gene          = MYL1
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = IIa,IIx
role          = Myosin essential light chain 1, fast (MLC1f; MYL1 isoform MLC1)
justification = Fast-fiber essential light chain. MYL1 yields two proteins from alternative promoters; MLC1f is the canonical (Displayed) isoform. Carried separately from MLC3f (D-log).

[MYL1_MLC3f]
gene          = MYL1
isoform       = P05976-2
tier          = 1
compartment   = thick_filament
fiber_type    = IIa,IIx
role          = Myosin essential light chain 3, fast (MLC3f; MYL1 isoform MLC3, formerly P06741)
justification = Distinct protein from MLC1f: N-terminal 53 residues of MLC1f replaced by 9 (VSP_038686); composition differs by up to 4.7 pp (Ala, Pro). Both occupy fast myosin; Layer B assigns each its own fraction.

[MYL11]
gene          = MYL11
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = IIa,IIx
role          = Myosin regulatory light chain 11, fast skeletal (formerly MYLPF; MLC2f)
justification = Fast-fiber regulatory light chain. Gene symbol renamed MYLPF -> MYL11 by HGNC; UniProt 2026_03 primary gene name is MYL11. Tissue note: fetal and adult skeletal muscle.

[MYL3]
gene          = MYL3
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = I
role          = Myosin essential light chain 3, slow / ventricular (MLC1sa/b)
justification = Slow-fiber essential light chain.

[MYL2]
gene          = MYL2
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = I
role          = Myosin regulatory light chain 2, slow / ventricular (MLC2s)
justification = Slow-fiber regulatory light chain. UniProt tissue note: highly expressed in type I fibers.

[ACTA1]
gene          = ACTA1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = all
role          = Actin, alpha skeletal muscle
justification = Thin-filament backbone. Two-step N-terminal processing (Met1, then Cys2) per UniProt chain features; see segments.ini.

[TTN]
gene          = TTN
isoform       = Q8WZ42-4
tier          = 1
compartment   = scaffold
fiber_type    = all
role          = Titin, skeletal (N2A / 'Soleus' isoform 4)
justification = Canonical Q8WZ42-1 (34,350 aa) is a meta-transcript containing all exons and is not expressed. UniProt: 'Isoform 4 is expressed in vertebrate skeletal muscle.' Isoform 4 = VSP_019142 (3454-4380 missing) + VSP_019151. Composition delta vs canonical <= 0.10 pp on any residue; length delta -905 aa matters for MW in Layer B.

[NEB]
gene          = NEB
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = all
role          = Nebulin
justification = Displayed isoform (UniProt isoform id P20929-2, 8525 aa) used as canonical. Shorter 6669-aa forms (isoforms 1, 4) lack 4103-5560 and other segments; composition delta <= 0.51 pp. Muscle-specific nebulin size variation is a Layer B sensitivity item, not a Layer A choice.

[TPM1]
gene          = TPM1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = IIa,IIx
role          = Tropomyosin alpha-1 (fast skeletal, TPM1alpha)
justification = Canonical is the isoform UniProt names 'Skeletal muscle, TPM1alpha'. Fast-fiber tropomyosin.

[TPM2]
gene          = TPM2
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = all
role          = Tropomyosin beta
justification = Canonical is the isoform UniProt names 'Skeletal muscle'. Present in both fiber types at differing levels (Layer B).

[TPM3]
gene          = TPM3
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = I
role          = Tropomyosin alpha-3 (slow skeletal)
justification = Canonical is the isoform UniProt names 'Skeletal muscle'. Slow-fiber tropomyosin.

[TNNT1]
gene          = TNNT1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = I
role          = Troponin T, slow skeletal
justification = Canonical (278 aa); isoforms 2/3 are shorter unnamed variants.

[TNNT3]
gene          = TNNT3
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = IIa,IIx
role          = Troponin T, fast skeletal (isoform Tnt1)
justification = Canonical = 'Tnt1'. 'Tnt3' (isoform 2) lacks residues 23-33 and is the other adult form; 'Tnt1f/Tnt3f' carry the fetal designation. Tnt1 vs Tnt3 composition delta <= 0.71 pp; not resolvable by proteomics protein groups -> logged as Layer B uncertainty. UniProt tissue note: fetal and adult fast skeletal muscle.

[TNNI1]
gene          = TNNI1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = I
role          = Troponin I, slow skeletal
justification = Slow-fiber troponin I.

[TNNI2]
gene          = TNNI2
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = IIa,IIx
role          = Troponin I, fast skeletal
justification = Fast-fiber troponin I. Isoform 2 same length; canonical.

[TNNC1]
gene          = TNNC1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = I
role          = Troponin C, slow skeletal / cardiac
justification = Slow-fiber troponin C.

[TNNC2]
gene          = TNNC2
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = IIa,IIx
role          = Troponin C, fast skeletal
justification = Fast-fiber troponin C.

[MYBPC1]
gene          = MYBPC1
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = I
role          = Myosin-binding protein C, slow-type
justification = Ten unnamed splice isoforms spanning 1120-1173 aa; canonical (1141) used. Max composition delta (isoform 1 vs 4) 0.43 pp; not resolvable at Layer B.

[MYBPC2]
gene          = MYBPC2
isoform       = canonical
tier          = 1
compartment   = thick_filament
fiber_type    = IIa,IIx
role          = Myosin-binding protein C, fast-type
justification = No splice isoforms.

[ACTN2]
gene          = ACTN2
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = Alpha-actinin-2
justification = Z-disc cross-linker in all fibers. Isoform 2 same length; canonical.

[ACTN3]
gene          = ACTN3
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = IIa,IIx
role          = Alpha-actinin-3
justification = UniProt tissue note: expression restricted to fast (type 2) fibers. R577X null allele is a population caveat for the paper, not a modelling decision.

[MYOM1]
gene          = MYOM1
isoform       = P52179-2
tier          = 1
compartment   = m_band
fiber_type    = all
role          = Myomesin-1 (adult skeletal isoform 2)
justification = Isoform 1 (Displayed) contains the 96-residue Ser/Pro-rich EH exon (residues 836-931, VSP_035663) that defines embryonic-heart EH-myomesin and is absent from adult skeletal muscle (Agarkova et al. J Biol Chem 2000;275:10256). Isoform 2 lacks it.

[MYOM2]
gene          = MYOM2
isoform       = canonical
tier          = 1
compartment   = m_band
fiber_type    = all
role          = Myomesin-2 (M-protein)
justification = M-band. Literature reports M-protein enriched in fast fibers; UniProt carries no tissue annotation. Assigned 'all'; level left to Layer B rather than asserted.

[OBSCN]
gene          = OBSCN
isoform       = canonical
tier          = 1
compartment   = m_band
fiber_type    = all
role          = Obscurin
justification = Meets the sarcomere criterion (M-band / A-band periphery) and is included on principle; expected to be low mass fraction. Canonical (giant kinase form) used.

[MYOT]
gene          = MYOT
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = Myotilin
justification = Z-disc. Canonical; isoform 2 is a 314-aa variant.

[LDB3]
gene          = LDB3
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = LIM domain-binding protein 3 (ZASP / Cypher)
justification = Z-disc. Canonical (727 aa) used; seven splice variants unresolved at Layer B.

[CSRP3]
gene          = CSRP3
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = I
role          = Muscle LIM protein (MLP-a)
justification = UniProt tissue note: cardiac and slow-twitch skeletal muscle. Isoform 2 (MLP-b, 58 aa) is disease-elevated; canonical MLP-a used.

[MYOZ1]
gene          = MYOZ1
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = Myozenin-1 (calsarcin-2)
justification = Z-disc. Fiber-type enrichment left to Layer B.

[MYOZ2]
gene          = MYOZ2
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = Myozenin-2 (calsarcin-1)
justification = Z-disc. Fiber-type enrichment left to Layer B.

[TMOD1]
gene          = TMOD1
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = all
role          = Tropomodulin-1
justification = Thin-filament pointed-end cap. Canonical.

[TMOD4]
gene          = TMOD4
isoform       = canonical
tier          = 1
compartment   = thin_filament
fiber_type    = all
role          = Tropomodulin-4 (skeletal)
justification = UniProt tissue note: highly expressed in skeletal muscle. Seed accession Q9NZR1 in the handoff was wrong (that is TMOD2); corrected by gene-name query.

[CAPZA1]
gene          = CAPZA1
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = F-actin-capping protein subunit alpha-1
justification = Z-disc barbed-end cap (CapZ alpha).

[CAPZA2]
gene          = CAPZA2
isoform       = canonical
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = F-actin-capping protein subunit alpha-2
justification = Z-disc barbed-end cap (CapZ alpha). Canonical; isoform 2 is a 172-aa fragment.

[CAPZB]
gene          = CAPZB
isoform       = P47756-1
tier          = 1
compartment   = z_disc
fiber_type    = all
role          = F-actin-capping protein subunit beta-1 (CapZ beta1, Z-disc isoform)
justification = beta1 and beta2 are identical except for the C-terminal tail (VSP_061615, residues 246-end): beta1 = 277 aa (31-32 residue tail), beta2 = 272 aa (26-27 residue tail). beta1 is the muscle / Z-disc isoform; beta2 is non-muscle (Schafer et al. J Cell Biol 1994;127:453; Hart et al. J Cell Biol 1999;147:1287). UniProt displays beta2 as canonical and names it 'isoform 1'; the Z-disc form is UniProt isoform id P47756-1.

# ---------------- Excluded: recorded with reason ----------------

[MYH4]
gene          = MYH4
isoform       = canonical
tier          = excluded
compartment   = thick_filament
fiber_type    = -
role          = Myosin heavy chain 4 (fast IIb)
justification = Not expressed at meaningful protein level in adult human limb muscle: 0.3 % of total MYH by iBAQ in human single fibers (Momenzadeh et al. 2023, Table S2; the 10 % MaxLFQ figure in Table S3 is a quantification artefact). Recorded for completeness; not fetched, not weighted.

# ---------------- Tier 3: recorded, not modelled here ----------------

[DES]
gene          = DES
isoform       = canonical
tier          = 3
compartment   = cytoskeleton
fiber_type    = -
role          = Desmin
justification = Intermediate filament linking Z-discs to each other and to the sarcolemma; not part of the sarcomeric lattice and partitions with the insoluble stromal residue under differential extraction. Belongs with the Tier 3 ECM/stromal set (collagen pipeline). Raised, not modelled here.

