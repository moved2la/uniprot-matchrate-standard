[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniprot-matchrate-standard"
version = "0.0.1"
description = "Sequence-derived amino acid standard for human skeletal muscle (Layer A exact / Layer B cited)"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []          # stdlib only for fetch/verify; add numpy/pandas for aggregation if needed

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
